<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StrengthHub | Reset Password</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <div class="logo">
        STRENGTH<span>HUB</span>
    </div>

    <nav id="main-nav">

        <a href="index.html">
            Home
        </a>

        <a href="workouts.html">
            Workouts

        <a href="map.html">

        <a href="Community.html">

    </nav>

</header>



<!-- ==========================================
     RESET PASSWORD
========================================== -->

<main class="account-page">

    <div class="account-container">

        <h1>
            Reset Password
        </h1>

        <p class="account-subtitle">
            Create a new password for your StrengthHub account.
        </p>


        <form
            id="resetPasswordForm"
            class="signup-form"
        >

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter your new password"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your new password"
                minlength="6"
                required
            >


            <button type="submit">
                UPDATE PASSWORD
            </button>

        </form>


        <p
            id="resetMessage"
            class="account-message"
        ></p>


        <p class="account-login">

            Remember your password?

            <a href="login.html">
                Log In
            </a>

        </p>

    </div>

</main>



<!-- ==========================================
     SCRIPTS
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="reset-password.js"></script>


</body>
