    >
</head>

<body>

<header>

    <nav>

        <a href="index.html">Home</a>

            href="admin.html"
            id="adminNavLink"

        >
            Admin

    </nav>

<section class="map-section">

    <h2>Fitness Map of London</h2>

    <p>
        Discover gyms, outdoor training areas and calisthenics spots across London.
    </p>


    <!-- SEARCH -->

    <div class="location-search">

        <input
            type="text"
            id="searchLocation"
            placeholder="Search a London location..."
        >

        <button
            type="button"
            onclick="searchLocation()"
        >
            Search
        </button>

    </div>


    <!-- SEARCH STATUS -->

    <p id="mapStatus"></p>


    <!-- MAP -->

    <div id="map"></div>


    <!-- FILTERS -->

    <div class="filters">

        <button
            type="button"
            onclick="showLocations('all')"
        >
            🌍 All
        </button>

        <button
            type="button"
            onclick="showLocations('indoor')"
        >
            🏋 Indoor
        </button>

        <button
            type="button"
            onclick="showLocations('outdoor')"
        >
            🌳 Outdoor
        </button>

        <button
            type="button"
            onclick="showLocations('calisthenics')"
        >
            🤸 Calisthenics
        </button>

    </div>

</section>


<footer>

    <p>© 2026 Aurex. Fitness Without Barriers.</p>

</footer>


<!-- Leaflet JavaScript -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================
   CREATE MAP
========================================= */

const map = L.map("map").setView(
    [51.5074, -0.1278],
    11
);


/* =========================================
   MAP TILES
========================================= */

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* =========================================
   VARIABLES
========================================= */

const markers = [];

let searchMarker = null;

let searchCircle = null;


/* =========================================
   STATUS
========================================= */

function setMapStatus(message) {

    const status =
        document.getElementById("mapStatus");

    status.textContent = message;

}


/* =========================================
   DIRECTIONS LINK
========================================= */

function getDirectionsURL(lat, lon) {

    return (
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        encodeURIComponent(lat + "," + lon)
    );

}


/* =========================================
   CREATE FITNESS POPUP
========================================= */

function createPopup(
    name,
    type,
    category,
    lat,
    lon
) {

    let icon = "💪";

    if (category === "indoor") {
        icon = "🏋";
    }

    if (category === "outdoor") {
        icon = "🌳";
    }

    if (category === "calisthenics") {
        icon = "🤸";
    }


    const directionsURL =
        getDirectionsURL(lat, lon);


    return `

        <div class="gym-popup">

            <h3>
                ${icon} ${name}
            </h3>

            <p>
                <strong>${type}</strong>
            </p>

            <p>
                ${category === "indoor"
                    ? "Indoor training facility"
                    : ""
                }

                ${category === "outdoor"
                    ? "Outdoor training area"
                    : ""
                }

                ${category === "calisthenics"
                    ? "Calisthenics / bodyweight training area"
                    : ""
                }
            </p>

            <a
                href="${directionsURL}"
                target="_blank"
                rel="noopener noreferrer"
                class="directions-button"
            >
                📍 Get Directions
            </a>

        </div>

    `;

}


/* =========================================
   ADD A MARKER
========================================= */

function addFitnessMarker(place) {

    const marker =
        L.marker(place.coords)
            .bindPopup(
                createPopup(
                    place.name,
                    place.type,
                    place.category,
                    place.coords[0],
                    place.coords[1]
                )
            );


    marker.addTo(map);


    markers.push({

        marker: marker,

        place: place,

        category: place.category

    });


    return marker;

}


/* =========================================
   ORIGINAL AUREX LOCATIONS
========================================= */

const locations = [

    {
        name: "Hyde Park Outdoor Gym",
        coords: [51.5073, -0.1657],
        type: "Outdoor Gym",
        category: "outdoor"
    },

    {
        name: "PureGym Oxford Street",
        coords: [51.5155, -0.1410],
        type: "Indoor Gym",
        category: "indoor"
    },

    {
        name: "Greenwich Fitness Area",
        coords: [51.4826, 0.0077],
        type: "Calisthenics Park",
        category: "calisthenics"
    }

];


/* =========================================
   ADD ORIGINAL LOCATIONS
========================================= */

locations.forEach(function(place) {

    addFitnessMarker(place);

});


/* =========================================
   SEARCH LOCATION
========================================= */

async function searchLocation() {

    const input =
        document.getElementById(
            "searchLocation"
        );


    const query =
        input.value.trim();


    if (query === "") {

        alert(
            "Please enter a London location."
        );

        return;

    }


    setMapStatus(
        "Searching for " +
        query +
        "..."
    );


    try {

        /* -------------------------------------
           FIND LOCATION
        ------------------------------------- */

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=1" +
            "&countrycodes=gb" +
            "&q=" +
            encodeURIComponent(
                query + ", London"
            );


        const response =
            await fetch(url, {
                headers: {
                    "Accept":
                        "application/json"
                }
            });


        if (!response.ok) {

            throw new Error(
                "Location search failed."
            );

        }


        const data =
            await response.json();


        if (!data.length) {

            setMapStatus(
                "Location not found."
            );

            alert(
                "We couldn't find that London location."
            );

            return;

        }


        const lat =
            parseFloat(data[0].lat);

        const lon =
            parseFloat(data[0].lon);


        /* -------------------------------------
           CLEAR OLD SEARCH MARKER
        ------------------------------------- */

        if (searchMarker) {

            map.removeLayer(
                searchMarker
            );

        }


        if (searchCircle) {

            map.removeLayer(
                searchCircle
            );

        }


        /* -------------------------------------
           MOVE MAP
        ------------------------------------- */

        map.flyTo(
            [lat, lon],
            14,
            {
                duration: 1.5
            }
        );


        /* -------------------------------------
           SEARCH LOCATION MARKER
        ------------------------------------- */

        searchMarker =
            L.marker([lat, lon])
                .addTo(map)
                .bindPopup(`

                    <div class="gym-popup">

                        <h3>
                            📍 ${query}
                        </h3>

                        <p>
                            Search area
                        </p>

                    </div>

                `);


        searchMarker.openPopup();


        /* -------------------------------------
           SEARCH RADIUS
        ------------------------------------- */

        searchCircle =
            L.circle(
                [lat, lon],
                {
                    radius: 5000
                }
            ).addTo(map);


        /* -------------------------------------
           FIND FITNESS PLACES
        ------------------------------------- */

        await findWorkoutPlaces(
            lat,
            lon
        );


    } catch (error) {

        console.error(
            "Location search error:",
            error
        );


        setMapStatus(
            "Unable to search right now."
        );


        alert(
            "Something went wrong while searching. Please try again."
        );

    }

}


/* =========================================
   FIND FITNESS LOCATIONS
========================================= */

async function findWorkoutPlaces(
    lat,
    lon
) {

    setMapStatus(
        "Finding gyms and training locations nearby..."
    );


    /* -----------------------------------------
       OVERPASS QUERY

       Searches both:
       - nodes
       - ways
       - relations
    ----------------------------------------- */

    const query = `

        [out:json][timeout:25];

        (

            nwr[
                "leisure"="fitness_centre"
            ](
                around:5000,
                ${lat},
                ${lon}
            );

            nwr[
                "leisure"="sports_centre"
            ](
                around:5000,
                ${lat},
                ${lon}
            );

            nwr[
                "leisure"="pitch"
            ](
                around:5000,
                ${lat},
                ${lon}
            );

            nwr[
                "leisure"="fitness_station"
            ](
                around:5000,
                ${lat},
                ${lon}
            );

            nwr[
                "sport"="fitness"
            ](
                around:5000,
                ${lat},
                ${lon}
            );

            nwr[
                "sport"="calisthenics"
            ](
                around:5000,
                ${lat},
                ${lon}
            );

            nwr[
                "sport"="gymnastics"
            ](
                around:5000,
                ${lat},
                ${lon}
            );

        );

        out center tags;

    `;


    const url =
        "https://overpass-api.de/api/interpreter?data=" +
        encodeURIComponent(query);


    try {

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Fitness search failed."
            );

        }


        const data =
            await response.json();


        /* -------------------------------------
           REMOVE OLD DISCOVERED MARKERS
        ------------------------------------- */

        for (
            let i = markers.length - 1;
            i >= 0;
            i--
        ) {

            const item =
                markers[i];


            if (
                item.place.discovered === true
            ) {

                map.removeLayer(
                    item.marker
                );

                markers.splice(
                    i,
                    1
                );

            }

        }


        /* -------------------------------------
           CHECK RESULTS
        ------------------------------------- */

        if (
            !data.elements ||
            data.elements.length === 0
        ) {

            setMapStatus(
                "No fitness locations were found within 5 km of this location."
            );

            return;

        }


        let foundCount = 0;


        /* -------------------------------------
           PROCESS RESULTS
        ------------------------------------- */

        data.elements.forEach(function(place) {

            const tags =
                place.tags || {};


            /* -------------------------------
               GET COORDINATES
            -------------------------------- */

            let placeLat =
                place.lat;

            let placeLon =
                place.lon;


            /*
                Ways and relations may use
                "center" instead of lat/lon.
            */

            if (
                (!placeLat || !placeLon) &&
                place.center
            ) {

                placeLat =
                    place.center.lat;

                placeLon =
                    place.center.lon;

            }


            if (
                !placeLat ||
                !placeLon
            ) {

                return;

            }


            /* -------------------------------
               GET NAME
            -------------------------------- */

            const name =
                tags.name ||
                tags["official_name"] ||
                "Fitness Location";


            /* -------------------------------
               DETERMINE CATEGORY
            -------------------------------- */

            let category =
                "indoor";

            let type =
                "Fitness Facility";


            /*
                Calisthenics
            */

            if (
                tags.sport === "calisthenics" ||
                tags.leisure === "fitness_station" ||
                (
                    tags.sport &&
                    tags.sport
                        .toLowerCase()
                        .includes("calisthenics")
                )
            ) {

                category =
                    "calisthenics";

                type =
                    "Calisthenics Area";

            }


            /*
                Outdoor
            */

            else if (
                tags.leisure === "pitch" ||
                tags.leisure === "fitness_station" ||
                tags.location === "outdoor"
            ) {

                category =
                    "outdoor";

                type =
                    "Outdoor Training Area";

            }


            /*
                Indoor
            */

            else if (
                tags.leisure === "fitness_centre" ||
                tags.leisure === "sports_centre" ||
                tags.sport === "fitness"
            ) {

                category =
                    "indoor";

                type =
                    "Indoor Fitness Facility";

            }


            /* -------------------------------
               CREATE PLACE
            -------------------------------- */

            const discoveredPlace = {

                name: name,

                coords: [
                    placeLat,
                    placeLon
                ],

                type: type,

                category: category,

                discovered: true

            };


            /* -------------------------------
               AVOID DUPLICATES
            -------------------------------- */

            const alreadyExists =
                markers.some(function(item) {

                    return (
                        Math.abs(
                            item.place.coords[0] -
                            placeLat
                        ) < 0.0001 &&

                        Math.abs(
                            item.place.coords[1] -
                            placeLon
                        ) < 0.0001
                    );

                });


            if (alreadyExists) {

                return;

            }


            /* -------------------------------
               ADD MARKER
            -------------------------------- */

            addFitnessMarker(
                discoveredPlace
            );


            foundCount++;

        });


        /* -------------------------------------
           STATUS
        ------------------------------------- */

        setMapStatus(
            foundCount +
            " fitness location" +
            (
                foundCount === 1
                    ? ""
                    : "s"
            ) +
            " found within 5 km."
        );


    } catch (error) {

        console.error(
            "Overpass error:",
            error
        );


        setMapStatus(
            "We couldn't load nearby fitness locations."
        );

    }

}


/* =========================================
   FILTER LOCATIONS
========================================= */

function showLocations(
    category
) {

    markers.forEach(function(item) {

        map.removeLayer(
            item.marker
        );

    });


    markers.forEach(function(item) {

        if (
            category === "all" ||
            item.category === category
        ) {

            item.marker.addTo(map);

        }

    });

}


/* =========================================
   ENTER KEY SEARCH
========================================= */

document
    .getElementById(
        "searchLocation"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchLocation();

            }

        }
    );

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
