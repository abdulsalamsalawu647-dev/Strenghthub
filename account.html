<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aurex | My Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <div class="logo">
        AUREX
    </div>


    <nav id="main-nav">

        <a href="index.html">
            Home
        </a>

        <a href="workouts.html">
            Workouts
        </a>

        <a href="nutrition.html">
            Nutrition
        </a>

        <a href="map.html">
            Map
        </a>

        <a href="community.html">
            Community
        </a>

        <a href="athletes.html">
            Athletes
        </a>

        <a href="videos.html">
            Videos
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a
            href="account.html"
            class="active"
        >
            Account
        </a>

        <a
            href="admin.html"
            id="adminNavLink"
            style="display: none;"
        >
            Admin
        </a>

    </nav>

</header>



<!-- ==========================================
     ACCOUNT
========================================== -->

<main class="account-page">

    <div class="account-container">


        <!-- ======================================
             LOGGED OUT
        ======================================= -->

        <div id="loggedOutSection">

            <span class="account-label">
                MY ACCOUNT
            </span>


            <h1>
                Welcome to<br>
                AUREX.
            </h1>


            <p class="account-subtitle">
                Log in to access your account and continue
                your training journey.
            </p>


            <div class="account-actions">

                <a
                    href="login.html"
                    class="account-button"
                >
                    Log In
                </a>


                <a
                    href="signup.html"
                    class="account-button account-button-outline"
                >
                    Create Account
                </a>

            </div>

        </div>



        <!-- ======================================
             LOGGED IN
        ======================================= -->

        <div
            id="loggedInSection"
            style="display: none;"
        >

            <span class="account-label">
                MY ACCOUNT
            </span>


            <h1>
                Welcome back,<br>

                <strong id="accountUsername"></strong> 👋
            </h1>


            <p class="account-subtitle">
                Keep training. Keep progressing.
            </p>


            <div class="account-actions">

                <!-- DASHBOARD -->

                <a
                    href="dashboard.html"
                    class="account-button"
                >
                    Dashboard
                </a>


                <!-- PROFILE -->

                <a
                    href="profile.html"
                    class="account-button account-button-outline"
                >
                    My Profile
                </a>


                <!-- LOG OUT -->

                <button
                    id="accountLogout"
                    class="account-button account-logout"
                >
                    Log Out
                </button>

            </div>


            <p
                id="accountMessage"
                class="account-message"
            ></p>

        </div>


    </div>

</main>



<!-- ==========================================
     SCRIPTS
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="account.js"></script>


</body>

</html>
