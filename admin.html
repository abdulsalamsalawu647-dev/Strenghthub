<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aurex Admin</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>
S

<body>


<header class="admin-header">

    <div class="admin-logo">
        AUREX
    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>

    <nav id="main-nav">

        <a href="index.html">Home</a>

    </nav>

</header>

<main class="admin-container">


    <h1 class="admin-title">
        Admin Dashboard
    </h1>


    <p class="admin-subtitle">
        Manage Aurex videos and content.
    </p>


    <p id="adminMessage">
        Checking admin access...
    </p>



    <section
        id="adminPanel"
        style="display: none;"
    >


        <div class="admin-card">


            <h2>
                Upload Video
            </h2>


            <p>
                Upload a video to the Aurex video library.
            </p>



            <form id="videoUploadForm">


                <label for="videoTitle">
                    Video Title
                </label>


                <input
                    type="text"
                    id="videoTitle"
                    placeholder="Enter video title"
                    required
                >



                <label for="videoDescription">
                    Description
                </label>


                <textarea
                    id="videoDescription"
                    placeholder="Enter video description"
                    rows="5"
                ></textarea>



                <label for="videoCategory">
                    Category
                </label>


                <select
                    id="videoCategory"
                    required
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Workouts">
                        Workouts
                    </option>

                    <option value="Calisthenics">
                        Calisthenics
                    </option>

                    <option value="Athletes">
                        Athletes
                    </option>

                    <option value="Events">
                        Events
                    </option>

                    <option value="Nutrition">
                        Nutrition
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>



                <label for="videoFile">
                    Video File
                </label>


                <input
                    type="file"
                    id="videoFile"
                    accept="video/*"
                    required
                >



                <button
                    type="submit"
                    class="admin-button"
                    id="uploadButton"
                >
                    Upload Video
                </button>


                <p id="uploadMessage"></p>
                <hr class="admin-divider">

<h2 class="library-title">
    Your Videos
</h2>

<p class="library-subtitle">
    Manage videos uploaded to Aurex.
</p>

<div id="videoLibrary" class="video-library">

    <p id="libraryMessage">
        Loading videos...
    </p>

</div>


            </form>


        </div>


    </section>


</main>



<script>


async function checkAdmin() {


    const message =
        document.getElementById("adminMessage");


    const panel =
        document.getElementById("adminPanel");


    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();



    if (userError || !user) {

        message.textContent =
            "You must be logged in to access Aurex Admin.";

        return;

    }



    const { data, error } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();



    if (error) {

        console.error(error);

        message.textContent =
            "Unable to verify admin access.";

        return;

    }



    if (!data) {

        message.textContent =
            "Access denied.";

        return;

    }



    message.textContent =
        "Welcome to Aurex Admin.";


    panel.style.display = "block";


}
checkAdmin();


// ==========================================
// ADMIN VIDEO LIBRARY
// ==========================================

async function loadVideoLibrary() {

    const library =
        document.getElementById("videoLibrary");

    const message =
        document.getElementById("libraryMessage");


    const {
        data: videos,
        error
    } =
        await supabaseClient
            .from("videos")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        message.textContent =
            "Unable to load videos.";

        return;

    }


    if (!videos || videos.length === 0) {

        message.textContent =
            "No videos uploaded yet.";

        return;

    }


    message.remove();


    for (const video of videos) {

        const card =
            document.createElement("div");

        card.className =
            "library-video";


        card.innerHTML = `

            <div class="library-video-info">

                <h3>
                    ${video.title}
                </h3>

                <p>
                    ${video.category || "No category"}
                </p>

            </div>

            <button
                class="delete-video-button"
                data-id="${video.id}"
                data-path="${video.file_path}"
            >
                Delete
            </button>

        `;


        library.appendChild(card);

    }


    // DELETE BUTTONS

    document
        .querySelectorAll(".delete-video-button")
        .forEach(button => {

            button.addEventListener(
                "click",
                async function () {

                    const videoId =
                        this.dataset.id;

                    const filePath =
                        this.dataset.path;


                    const confirmed =
                        confirm(
                            "Are you sure you want to delete this video?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    this.disabled = true;

                    this.textContent =
                        "Deleting...";


                    // Delete file from Storage

                    const {
                        error: storageError
                    } =
                        await supabaseClient
                            .storage
                            .from("aurex-video")
                            .remove([
                                filePath
                            ]);


                    if (storageError) {

                        console.error(
                            storageError
                        );

                        alert(
                            "Could not delete the video file."
                        );

                        this.disabled = false;

                        this.textContent =
                            "Delete";

                        return;

                    }


                    // Delete database record

                    const {
                        error: databaseError
                    } =
                        await supabaseClient
                            .from("videos")
                            .delete()
                            .eq(
                                "id",
                                videoId
                            );


                    if (databaseError) {

                        console.error(
                            databaseError
                        );

                        alert(
                            "The video file was deleted, but the database record could not be removed."
                        );

                        return;

                    }


                    // Remove card from page

                    this
                        .closest(".library-video")
                        .remove();

                }
            );

        });

}


// Load library

loadVideoLibrary();
</script>


</body>

</html>
