```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StrengthHub | Log In</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================================
     HEADER
========================================== -->

<header>

    <div class="logo">
        STRENGTH<span>HUB</span>
    </div>

    <nav id="main-nav">

        <a href="index.html">Home</a>

        <a href="workouts.html">Workouts</a>

        <a href="map.html">Map</a>

        <a href="Community.html">Community</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

        <a href="shop.html">Aurex</a>

        <a href="account.html">My Account</a>

    </nav>

</header>


<!-- ==========================================
     LOGIN
========================================== -->

<main class="account-page">

    <div class="account-container">

        <h1>Log In</h1>

        <p class="account-subtitle">
            Welcome back to StrengthHub
        </p>


        <form id="loginForm" class="signup-form">

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <!-- FORGOT PASSWORD -->

            <div class="forgot-password">

                <a href="forgot-password.html">
                    Forgot password?
                </a>

            </div>


            <button type="submit">
                Log In
            </button>

        </form>


        <p id="loginMessage" class="account-message"></p>


        <p class="account-login">

            Don't have a StrengthHub account?

            <a href="signup.html">
                Create Account
            </a>

        </p>

    </div>

</main>


<!-- ==========================================
     SCRIPTS
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="login.js"></script>


</body>

</html>
```
